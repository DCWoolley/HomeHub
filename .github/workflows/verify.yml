name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, SQL tests, migrations, and browser
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Locate SQL tools
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($pattern in @(
            'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe',
            'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\*\Tools\Binn\SQLCMD.EXE'
          )) {
            $tool = Get-ChildItem -Path $pattern | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $tool) { throw "Required SQL tool missing: $pattern" }
            Split-Path $tool.FullName -Parent | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Run required checks
        run: ./scripts/Verify.ps1 -Sql -Browser
      - name: Upload test results, logs, and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verification/**
            artifacts/browser/**/*.log
            artifacts/browser/**/*.png
            artifacts/browser/**/run.json
            artifacts/browser/**/cleanup.txt
          if-no-files-found: warn
          retention-days: 7
